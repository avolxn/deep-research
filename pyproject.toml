[project]
name = "deep-research"
version = "0.1.0"
description = ""
authors = [
    {name = "avolxn",email = "vlad.eldashov2303@mail.ru"}
]
readme = "README.md"
requires-python = ">=3.11,<4.0.0"
dependencies = [
    "langgraph (>=0.6.8,<0.7.0)",
    "pydantic-settings (>=2.11.0,<3.0.0)",
    "langchain-openai (>=1.1.1,<2.0.0)",
    "tavily-python (>=0.7.14,<0.8.0)",
    "fastapi (>=0.115.0,<1.0.0)",
    "uvicorn[standard] (>=0.34.0,<1.0.0)",
    "sse-starlette (>=2.2.0,<3.0.0)",
]

[tool.poetry]
packages = [{include = "deep_research", from = "src"}]

[tool.poetry.group.dev.dependencies]
ipykernel = "^6.30.1"
ruff = "^0.14.2"
pre-commit = "^3.8.0"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP"]
ignore = ["E501", "E741"]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"